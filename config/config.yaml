# Scalable Amazon Reviews Lakehouse - Configuration
# All paths and Spark tunings externalized (no hardcoded strings in jobs)

paths:
  raw: /data/raw
  bronze: /data/bronze
  silver: /data/silver
  gold: /data/gold
  spark_events: /data/spark-events
  metadata: /data/metadata

# Amazon data paths (nested under raw/bronze/silver/gold roots):
#   raw/amazon, bronze/amazon_reviews, silver/amazon_reviews, gold/amazon_reviews

# Fetch: default categories and size limits when auto-fetching (pipeline/dashboard)
# Use "all" for all 33 categories, or e.g. ["Gift_Cards", "All_Beauty"]
# max_rows_per_category: limit rows per category; null = no limit (full download)
fetch:
  default_categories: ["Gift_Cards"]
  max_rows_per_category: 10000  # set to null for full download

# Spark tuning - dashboard runs in local mode (driver = executor).
# Dynamic: shuffle_partitions computed from input size when dynamic_config.enabled=true.
spark:
  executor_memory: 2g
  driver_memory: 2g
  max_partition_bytes: 64m
  memory_fraction: 0.5
  memory_storage_fraction: 0.3
  shuffle_partitions: 8  # Fallback when dynamic disabled
  adaptive_enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  event_log_enabled: true
  event_log_dir: /opt/spark-events
  # AQE: coalesce, advisory partition size, skew join for scalable shuffle
  advisory_partition_size: 134217728  # 128MB target per partition after coalesce
  coalesce_partitions_enabled: true
  skew_join_enabled: true  # Handle skewed partitions (e.g. popular products)

# Dynamic config: estimate input size and set shuffle_partitions automatically
dynamic_config:
  enabled: true
  target_partition_size_bytes: 134217728  # 128MB per partition
  min_shuffle_partitions: 8
  max_shuffle_partitions: 400

# Gold layer settings
gold:
  rolling_days: 30
  optimize_threshold_rows: 100000  # Min rows to run OPTIMIZE
  optimize_threshold_size_mb: 100  # Min table size (MB) to run OPTIMIZE; also checks fragmentation

# Debug: set explain_enabled=true and SPARK_DEBUG=1 to log df.explain() to data/debug/
debug:
  explain_enabled: false

# Great Expectations (optional; Amazon suites can be added)
gx:
  checkpoint_name: amazon_silver_checkpoint
  expectations_suite: amazon_silver_suite
